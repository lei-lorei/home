<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  background: #272727;
  color: #ADADAD;
  font-family: Commit Mono, monospace;
  text-align: center;
  margin: 0;
  padding: 15px;
}

.home-link {
  display: inline-block;
  margin-top: 20px;
  margin-bottom: 15px;

  color: #F2F2F2;
  text-decoration: none;

  letter-spacing: 3px;
  font-size: 14px;

  opacity: 0.6;

  transition: opacity 0.3s ease;
}

.home-link:hover {
  opacity: 1;
}

.basket-link {
  position: absolute;

  top: 25px;
  right: 25px;

  color: #F2F2F2;
  text-decoration: none;

  font-size: 11px;
  letter-spacing: 2px;

  opacity: 0.6;

  transition: opacity 0.3s ease;
}

.basket-link:hover {
  opacity: 1;
}
  
h1 {
  font-weight: 100;
  letter-spacing: 6px;
  font-size: 22px;

  opacity: 0;

  animation: fadeIn 2s forwards;
}

@keyframes fadeIn {

  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }

}

#basket {
  max-width: 700px;
  margin: 60px auto 0;
}

.basket-item {

  display: flex;

  align-items: center;

  gap: 25px;

  padding: 25px 0;

  border-bottom: 1px solid rgba(203,190,190,0.2);

  text-align: left;

}

.basket-item img {

  width: 120px;
  height: 120px;

  object-fit: contain;

}

.item-details {

  flex: 1;

}

.item-title {

  color: #DBDBDB;

  font-size: 14px;

  letter-spacing: 2px;

  margin-bottom: 10px;

}

.item-size {

  font-size: 11px;

  letter-spacing: 1px;

  opacity: 0.7;

  margin-bottom: 8px;

}

.item-price {

  font-size: 12px;

  letter-spacing: 1px;

}

.quantity {

  display: flex;

  align-items: center;

  gap: 12px;

  margin-top: 12px;

  font-size: 12px;

}

.quantity button {

  background: none;

  border: none;

  color: #DBDBDB;

  font-family: Commit Mono, monospace;

  font-size: 15px;

  cursor: pointer;

  opacity: 0.6;

}

.quantity button:hover {

  opacity: 1;

}

.remove {

  display: block;

  margin-top: 10px;

  padding: 0;

  background: none;

  border: none;

  color: #C4C4C4;

  font-family: Commit Mono, monospace;

  font-size: 10px;

  letter-spacing: 1px;

  cursor: pointer;

  opacity: 0.45;

}

.remove:hover {

  opacity: 1;

}

#basket-summary {

  margin-top: 40px;

  text-align: right;

  font-size: 13px;

  letter-spacing: 2px;

}

#total {

  color: #F2F2F2;

}

#empty {

  margin-top: 80px;

  font-size: 12px;

  letter-spacing: 2px;

  opacity: 0.6;

}

.checkout {

  display: inline-block;

  margin-top: 25px;

  padding: 10px 20px;

  background: none;

  border: 1px solid rgba(203,190,190,0.35);

  color: #F2F2F2;

  font-family: Commit Mono, monospace;

  font-size: 11px;

  letter-spacing: 2px;

  cursor: pointer;

  transition: opacity 0.3s ease;

}

.checkout:hover {

  opacity: 0.7;

}

footer {

  margin-top: 100px;

  font-size: 11px;

  opacity: 0.5;

  letter-spacing: 2px;

}

@media (max-width: 600px) {

  #basket {
    margin-top: 40px;
  }

  .basket-item {

    gap: 15px;

    align-items: flex-start;

  }

  .basket-item img {

    width: 90px;
    height: 90px;

  }

  .item-title {

    font-size: 12px;

  }

  #basket-summary {

    text-align: center;

  }

}

#shipping-section {
  margin-top: 35px;
  text-align: right;
  font-size: 12px;
  letter-spacing: 1px;
}

#shipping-section label {
  display: block;
  margin-bottom: 10px;
  opacity: 0.7;
}

#shipping-country {
  background: #272727;
  color: #DBDBDB;
  border: 1px solid rgba(203,190,190,0.35);
  padding: 8px 10px;
  font-family: Commit Mono, monospace;
  font-size: 11px;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

#shipping-line {
  margin-bottom: 10px;
}

#shipping-cost {
  color: #DBDBDB;
}

#shipping-status {
  margin-top: 8px;
  font-size: 10px;
  opacity: 0.5;
}
  
</style>

</head>

<body>

<a class="home-link" href="shop.html">
  shop
</a>
  
<a class="basket-link" href="basket.html">
  basket
</a>
  
<h1>basket</h1>

<div id="basket"></div>

<div id="empty">
  your basket is empty
</div>

<div id="basket-summary">

  <div id="shipping-section">

    <label for="shipping-country">
      deliver to
    </label>

    <select id="shipping-country" onchange="handleCountryChange()">

      <option value="GB">United Kingdom</option>

      <option value="AT">Austria</option>
      <option value="BE">Belgium</option>
      <option value="BG">Bulgaria</option>
      <option value="HR">Croatia</option>
      <option value="CY">Cyprus</option>
      <option value="CZ">Czechia</option>
      <option value="DK">Denmark</option>
      <option value="EE">Estonia</option>
      <option value="FI">Finland</option>
      <option value="FR">France</option>
      <option value="DE">Germany</option>
      <option value="GR">Greece</option>
      <option value="HU">Hungary</option>
      <option value="IE">Ireland</option>
      <option value="IT">Italy</option>
      <option value="LV">Latvia</option>
      <option value="LT">Lithuania</option>
      <option value="LU">Luxembourg</option>
      <option value="MT">Malta</option>
      <option value="NL">Netherlands</option>
      <option value="PL">Poland</option>
      <option value="PT">Portugal</option>
      <option value="RO">Romania</option>
      <option value="SK">Slovakia</option>
      <option value="SI">Slovenia</option>
      <option value="ES">Spain</option>
      <option value="SE">Sweden</option>

      <option value="US">United States</option>
      <option value="AU">Australia</option>

    </select>

    <div id="shipping-line">
      standard delivery&nbsp;&nbsp;
      <span id="shipping-cost">calculating...</span>
    </div>

    <div id="shipping-status"></div>

  </div>

  total&nbsp;&nbsp;
  <span id="total">£0.00</span>

  <br>

  <button
    class="checkout"
    id="checkout-button"
    onclick="checkout()"
    disabled
  >
    checkout
  </button>

</div>
<footer>
  © lily deng • 2026–
</footer>


<script>
let shippingQuote = null;
let quoteRequestNumber = 0;
  
function loadBasket() {

  const basket =
    JSON.parse(localStorage.getItem("basket")) || [];

  const container =
    document.getElementById("basket");

  const empty =
    document.getElementById("empty");

  const summary =
    document.getElementById("basket-summary");

  container.innerHTML = "";

  let total = 0;

  if (basket.length === 0) {

    empty.style.display = "block";
    summary.style.display = "none";

    return;

  }

  empty.style.display = "none";
  summary.style.display = "block";

  basket.forEach(function(item, index) {

    total += item.price * item.quantity;

    const element =
      document.createElement("div");

    element.className = "basket-item";

    element.innerHTML = `

      <img src="${item.image}">

      <div class="item-details">

        <div class="item-title">
          ${item.title}
        </div>

        <div class="item-size">
          ${item.size} · ${item.material}
        </div>

        <div class="item-price">
          £${item.price.toFixed(2)}
        </div>

        <div class="quantity">

          <button onclick="changeQuantity(${index}, -1)">
            −
          </button>

          <span>
            ${item.quantity}
          </span>

          <button onclick="changeQuantity(${index}, 1)">
            +
          </button>

        </div>

        <button
          class="remove"
          onclick="removeItem(${index})"
        >
          remove
        </button>

      </div>

    `;

    container.appendChild(element);

  });

document.getElementById("shipping-country").value =
  localStorage.getItem("shippingCountry") || "GB";

updateShippingQuote();

}

async function checkout() {

  const basket =
    JSON.parse(localStorage.getItem("basket")) || [];

  if (basket.length === 0) {
    alert("your basket is empty");
    return;
  }

  const country =
    document.getElementById("shipping-country").value;

  if (!shippingQuote) {
    alert("please wait for shipping to be calculated");
    return;
  }

  const button =
    document.getElementById("checkout-button");

  button.disabled = true;
  button.textContent = "loading...";

  try {

    const response = await fetch(
      "https://shop-checkout-sbl3.vercel.app/api/checkout",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          basket: basket,
          country: country
        })
      }
    );

    const data = await response.json();

    if (data.url) {
      window.location.href = data.url;
      return;
    }

    throw new Error(
      data.error || "Unable to start checkout"
    );

  } catch (error) {

    console.error("Checkout error:", error);

    alert(
      "unable to start checkout: " +
      error.message
    );

    button.disabled = false;
    button.textContent = "checkout";
  }
}

  const data = await response.json();

  if (data.url) {
    window.location.href = data.url;
  } else {
    alert("unable to start checkout");
  }

}
  
function changeQuantity(index, change) {

  const basket =
    JSON.parse(localStorage.getItem("basket")) || [];

  basket[index].quantity += change;

  if (basket[index].quantity <= 0) {

    basket.splice(index, 1);

  }

  localStorage.setItem(
    "basket",
    JSON.stringify(basket)
  );

  loadBasket();

}


function removeItem(index) {

  const basket =
    JSON.parse(localStorage.getItem("basket")) || [];

  basket.splice(index, 1);

  localStorage.setItem(
    "basket",
    JSON.stringify(basket)
  );

  loadBasket();

}


loadBasket();

async function updateShippingQuote() {

  const basket =
    JSON.parse(localStorage.getItem("basket")) || [];

  const country =
    document.getElementById("shipping-country").value;

  const shippingCost =
    document.getElementById("shipping-cost");

  const shippingStatus =
    document.getElementById("shipping-status");

  const checkoutButton =
    document.getElementById("checkout-button");

  quoteRequestNumber += 1;

  const requestNumber = quoteRequestNumber;

  shippingQuote = null;

  checkoutButton.disabled = true;
  shippingCost.textContent = "calculating...";
  shippingStatus.textContent = "";

  if (basket.length === 0) {
    return;
  }

  try {

    const response = await fetch(
      "https://shop-checkout-sbl3.vercel.app/api/prodigi-quote",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          basket: basket.map(function(item) {
            return {
              productId: item.productId,
              quantity: item.quantity
            };
          }),
          country: country
        })
      }
    );

    const data = await response.json();

    if (requestNumber !== quoteRequestNumber) {
      return;
    }

    if (!response.ok || !data.shipping) {
      throw new Error(
        data.error || "Shipping unavailable"
      );
    }

    shippingQuote = {
      amount: parseFloat(data.shipping.amount),
      currency: data.shipping.currency,
      shipments: data.shipments
    };

    shippingCost.textContent =
      "£" + shippingQuote.amount.toFixed(2);

    shippingStatus.textContent =
      "standard delivery";

    checkoutButton.disabled = false;

    updateTotal();

  } catch (error) {

    console.error("Shipping quote error:", error);

    shippingQuote = null;

    shippingCost.textContent = "unavailable";

    shippingStatus.textContent =
      "standard shipping is unavailable for this destination";

    updateTotal();
  }
}

function updateTotal() {

  const basket =
    JSON.parse(localStorage.getItem("basket")) || [];

  let total = 0;

  basket.forEach(function(item) {
    total += item.price * item.quantity;
  });

  if (shippingQuote) {
    total += shippingQuote.amount;
  }

  document.getElementById("total").textContent =
    "£" + total.toFixed(2);
}

function handleCountryChange() {

  const country =
    document.getElementById("shipping-country").value;

  localStorage.setItem(
    "shippingCountry",
    country
  );

  updateShippingQuote();
}
</script>

</body>
</html>
