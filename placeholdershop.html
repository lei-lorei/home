<!DOCTYPE html>

<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {

    background:#923F4F;

    color:#EACDD3;

    font-family:Commit Mono, monospace;

    margin:0;

    padding:20px;

    min-height:100vh;

    box-sizing:border-box;

    text-align:center;

    display:flex;

    flex-direction:column;

}

@keyframes fadeIn {

    from {
        opacity:0;
    }

    to {
        opacity:1;
    }

}

.home-link {

    align-self:center;

    margin-top:20px;

    color:#DCADB6;

    text-decoration:none;

    letter-spacing:3px;

    font-size:14px;

    opacity:.6;

    transition:opacity .3s ease;

}

.home-link:hover {

    opacity:1;

}

main {

    flex:1;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}

h1 {

    margin:0;

    color:#F7EDEF;

    font-weight:100;

    font-size:22px;

    letter-spacing:6px;

    opacity:0;

    animation:fadeIn 2s forwards;

    animation-delay:.5s;

}

.placeholder {

    margin-top:45px;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:18px;

    opacity:0;

    animation:fadeIn 1.8s forwards;

    animation-delay:1.2s;

}

.symbol {

    color:#DCADB6;

    font-size:18px;

    opacity:.6;

    animation:
        breathe 4s ease-in-out infinite;

}

@keyframes breathe {

    0%,100% {

        opacity:.35;

        transform:scale(1);

    }

    50% {

        opacity:.8;

        transform:scale(1.08);

    }

}

.status {

    color:#EACDD3;

    font-size:11px;

    letter-spacing:3px;

}

.note {

    max-width:400px;

    margin-top:5px;

    color:#F7EDEF;

    font-size:10px;

    line-height:1.8;

    letter-spacing:1px;

}

footer {

    margin-top:80px;

    font-size:11px;

    opacity:.5;

    letter-spacing:2px;

}

@media(max-width:700px) {

    body {

        padding:15px;

    }

    .home-link {

        font-size:13px;

    }

    h1 {

        font-size:18px;

        letter-spacing:4px;

    }

    .placeholder {

        margin-top:35px;

    }

    .status {

        font-size:10px;

        letter-spacing:2px;

    }

    .note {

        max-width:280px;

        font-size:9px;

    }

    footer {

        margin-top:60px;

        font-size:9px;

    }

}

</style>

</head>


<body>


<a
    class="home-link"
    href="index.html"
>
    home
</a>


<main>


    <h1>
        shop
    </h1>


    <div class="placeholder">


        <div class="symbol">
            ◡ ‿ ◡
        </div>


        <div class="status">
            ────୨ৎ────
        </div>


        <div class="note">
            we r closed come back l8er
        </div>


    </div>


</main>


<footer>

    © lily deng • 2026–

</footer>


</body>

</html>
```
