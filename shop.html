<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  background: #272727;
  color: #808080;
  font-family: Commit Mono, monospace;
  text-align: center;
  margin: 0;
  padding: 15px;
}
  
h1 {
  font-weight: 100;
  letter-spacing: 6px;
  font-size: 22px;

  opacity: 0;
  animation: fadeIn 2s forwards;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes pulse {

  0% {
    opacity: 0.35;
  }

  30% {
    opacity: 1;
  }

  70% {
    opacity: 1;
  }

  100% {
    opacity: 0.25;
  }

}


.subtitle {

    opacity:0;

    font-size:13px;

    letter-spacing:2px;

    color:#C4C4C4;

    animation:fadeIn 2s forwards;

    animation-delay:1s;

    transition:opacity 2s ease;

    height:45px;

    line-height:1.6;

}

.subtitle-citation {

    display:inline-block;

    margin-left: 15px;

}
  
.home-link {

  display: inline-block;

  margin-top: 20px;

  margin-bottom: 15px;

  color: #808080;

  text-decoration: none;

  letter-spacing: 3px;

  font-size: 14px;

  opacity: 0.6;

  transition: opacity 0.3s ease;
}

.home-link:hover {
  opacity: 1;
}
  
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px;
    padding: 30px;
    max-width: 1200px;
    margin: auto;
    transition: opacity .45s ease;
}

.gallery.fade-out{
    opacity:0;
}

@media (max-width: 900px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {

  .subtitle {
    height: 60px;
    font-size: 11px;
    line-height: 1.6;
  }

  .gallery {
    grid-template-columns: 1fr;
    gap: 30px;
    padding: 20px;
  }

}
  
    .nav-btn{
        font-size:13px;
    }

    .page-indicator{
        min-width:60px;
    }

}

.artwork{
    text-align:center;
    opacity:1;
    filter:blur(0px);
    transform:translateY(0);
    transition:
        opacity .6s ease,
        transform .6s ease,
        filter .6s ease;
}

.artwork.hidden{
    opacity:0;
    transform:translateY(10px);
    filter:blur(6px);
}
  
.artwork img {
  width: 100%;
  max-height: 350px;

  object-fit: contain;

  cursor: pointer;

  opacity: 1;

  transition: opacity 0.5s ease;
}

.artwork:hover {
  opacity: 1 !important;
}

.info {
  margin-top: 10px;

  color: #808080;
  font-size: 15px;
  font-family: Commit Mono, monospace;
  letter-spacing: 2px;

  opacity: 0;
  transition: opacity 0.5s ease;
}

.artwork:hover .info {
  opacity: 1;
}
  
#lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  background: rgba(20,20,20,0.5);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  justify-content: center;
  align-items: center;

  z-index: 1000;
}
  
#lightbox-img {
  max-width: 90vw;
  max-height: 75vh;
}

@media (max-width: 768px) {

  .artwork {
    animation: none;
  }

} 
#mobile-nav {
  display: none !important;
}

#lightbox-content {
  display: flex;
  flex-direction: column;
  align-items: center;

  max-width: 90vw;
  max-height: 90vh;

  position: relative;
}

#lightbox-caption {

  margin-top: 15px;

  margin-left: 25px;

  color: #DBDBDB;

  font-size: 14px;

  letter-spacing: 2px;
}

#archive-content {
  opacity: 1;
}
  
#prev-btn,
#next-btn {

  position: absolute;

  background: none;
  border: none;

  color: #DBDBDB;

  font-size: 22px;

  opacity: 0.5;

  transition: opacity 0.3s ease;

  cursor: pointer;
}

#prev-btn {
  left: -60px;
  top: 40%;
  transform: translateY(-50%);
}

#next-btn {
  right: -60px;
  top: 40%;
  transform: translateY(-50%);
}

#prev-btn:hover,
#next-btn:hover {
  opacity: 1;
}
  
footer {
  margin-top: 100px;

  font-size: 11px;

  opacity: 0.5;

  letter-spacing: 2px;
}
  
</style>
</head>

<body>

<div id="lightbox" onclick="closeImage()">

 <div id="lightbox-content">

<script>
let lastScrollTop = 0;
  
let currentIndex = 0;

const images = Array.from(
  document.querySelectorAll(".artwork img")
);
  
function openImage(img) {

  currentIndex = images.indexOf(img);

  document.getElementById("lightbox").style.display = "flex";

  document.getElementById("lightbox-img").src = img.src;

  document.getElementById("lightbox-caption").innerHTML =
    img.dataset.caption;
}

function closeImage() {
  document.getElementById("lightbox").style.display = "none";
}
  
function showImage(index) {

  currentIndex = index;

  const img = images[currentIndex];

  document.getElementById("lightbox-img").src = img.src;

  document.getElementById("lightbox-caption").innerHTML =
    img.dataset.caption;
}

document.getElementById("next-btn").onclick = function(event) {

  event.stopPropagation();

  showImage((currentIndex + 1) % images.length);

};

document.getElementById("prev-btn").onclick = function(event) {

  event.stopPropagation();

  showImage(
    (currentIndex - 1 + images.length) % images.length
  );

};
  
function updateOpacity() {

  const artworks =
    document.querySelectorAll(".artwork");

  const screenCenter =
    window.innerHeight / 2;

  artworks.forEach(function(item) {

    const rect =
      item.getBoundingClientRect();

    const itemCenter =
      rect.top + rect.height / 2;

    const distance =
      Math.abs(itemCenter - screenCenter);

    const maxDistance =
      window.innerHeight / 2;

    let opacity =
      1 - distance / maxDistance;

    opacity =
      Math.max(0.25, opacity);

    item.style.opacity = opacity;
    
  const caption = item.querySelector(".info");

if (caption) {
  caption.style.opacity = Math.max(0.4, opacity);
}

  });

}

window.addEventListener("scroll", updateOpacity);

updateOpacity();

</script>

</html>
